name: Deploy MeteoCompare to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run regression tests
        run: |
          node tests/smoke.mjs
          node tests/ui-performance.mjs
          node tests/static-audit.mjs
          node tests/pages-compat.mjs
          node tests/fidelity-regression.mjs
          node tests/analysis-suite.mjs
          node tests/stability-i18n-audit.mjs
          node tests/chart-redesign.mjs
          node tests/pwa-about-legends.mjs
          node tests/interactive-legends.mjs
          node tests/evolution-reliability-icon.mjs
          node tests/model-data-audit.mjs
          node tests/local-data-center.mjs
          node tests/global-performance-audit.mjs
          node tests/minimal-analytics.mjs
          node tests/settings-short-models.mjs
          node tests/run-metadata-hosting.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Prepare static site
        run: |
          mkdir -p _site
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '_site' \
            --exclude 'tests' \
            ./ _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: test-and-package
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
