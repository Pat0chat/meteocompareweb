name: Roll back GitHub Pages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Stable release tag to redeploy (example: v1.9.0)'
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout requested release
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Remove obsolete runtime residue
        shell: bash
        run: rm -f js/android_strings.js

      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          git describe --tags --exact-match HEAD
          test "v$(node tools/project-version.mjs)" = "${{ inputs.tag }}"
      - name: Run regression tests from release
        run: npm run tests
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Build release site
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist
          include-hidden-files: true
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate-and-package
    steps:
      - name: Deploy selected stable release
        id: deployment
        uses: actions/deploy-pages@v5.0.0
